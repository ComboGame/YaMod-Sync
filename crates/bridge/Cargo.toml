[package]
name = "ymsync-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The sync core for a player that lives in another process — the desktop Yandex
# Music app, through the mod that embeds YandexSync. Spoken to over stdin and
# stdout, one JSON object per line.

[[bin]]
name = "ymsync-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The Yandex Music app plays; this process only steers it.
ymsync = { version = "0.3.1", path = "../core", default-features = false, features = ["tls-native"] }
ymsync-proto = { version = "0.3.1", path = "../proto" }

[dev-dependencies]
ymsync-relay = { version = "0.3.1", path = "../relay", default-features = false }
# A scripted participant for the tests, speaking the relay protocol directly.
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
