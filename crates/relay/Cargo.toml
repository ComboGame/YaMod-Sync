[package]
name = "ymsync-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["cli"]

# The standalone `ymsync-relay` binary — the server. Off when a player embeds
# the relay to host a room itself, which needs neither clap nor a signal handler.
cli = ["dep:clap", "dep:tracing-subscriber", "tokio/signal"]

[[bin]]
name = "ymsync-relay"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"], optional = true }
futures-util = "0.3.34"
serde_json = "1.0.151"
# `macros` is a base feature rather than part of `cli`: `tokio::select!` is used
# by the library itself, not only by the binary.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# Server side only, and deliberately without TLS: the relay is meant to sit
# behind a reverse proxy when it faces the internet, and the default features
# would drag in native-tls for nothing.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
ymsync-proto = { version = "0.3.1", path = "../proto" }

[dev-dependencies]
# The integration tests act as clients, which the relay itself never does.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
