[workspace]
resolver = "3"
members = ["crates/proto", "crates/relay", "crates/core", "crates/bridge", "crates/android"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
