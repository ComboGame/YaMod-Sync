# ymsync-relay за уже настроенным nginx. Гайд: docs/server.md, раздел 4В.
#
# Вставьте этот location в server { … } вашего домена с HTTPS (listen 443 ssl).
# Адрес для приложения: wss://ваш.домен/ymsync
#
# Релей при этом слушает только localhost: RELAY_PUBLISH=127.0.0.1:8787 в .env.

location /ymsync {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Клиенты пингуют релей каждые 5 с, так что хватило бы и минуты;
    # с запасом — на случай подвисшей сети у телефона.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
