# Builds the YandexMusicSync installer and publishes it as a GitHub release.
#
# The version is mod/VERSION. A push that touches the mod or the Rust crates
# builds the installer; if there is no release `mod-v<VERSION>` yet, it is
# published and the tag is created on that commit. Bumping VERSION is how a new
# release is made. A pushed tag `mod-vX.Y.Z` does the same for an exact commit.
# «Run workflow» on the Actions page builds the installer without a release, as
# a downloadable artifact.
#
# The patcher downloads the current stable Yandex Music for Windows, patches it,
# builds ymsync-bridge from crates/bridge and packs an NSIS installer — all of
# which needs Windows (MSVC for the bridge, the Windows build of the app).

name: release

on:
  push:
    branches: ["**"]
    tags: ["mod-v*"]
    paths:
      - "mod/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "release-notes/mod.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          # The version that wrote mod/bun.lockb.
          bun-version: 1.1.27

      - name: Bridge tests
        run: cargo test --locked -p ymsync-bridge

      - name: Dependencies
        working-directory: mod
        env:
          # electron-builder fetches its own Electron; the npm one is only for
          # running the mod from a dev folder.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install

      - name: Patch and package
        working-directory: mod
        run: bun run start

      - id: built
        name: Locate the installer
        run: |
          installer=$(ls mod/.versions/*/mod/dist/YandexMusicSync-Setup-*.exe | head -1)
          [ -f "$installer" ] || { echo "::error::no installer"; exit 1; }
          app_version=$(basename "$installer" | sed -E 's/YandexMusicSync-Setup-(.*)\.exe/\1/')
          mkdir -p dist
          cp "$installer" dist/
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "Яндекс Музыка $app_version"; cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: yandex-music-sync-${{ steps.built.outputs.app_version }}
          path: dist/*
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.built.outputs.app_version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="mod-v$(tr -d '[:space:]' < mod/VERSION)"
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Релиз $tag уже есть — новый не создаю. Поднимите mod/VERSION для нового релиза."
            exit 0
          fi
          mod_version="${tag#mod-v}"
          sed "s/{APP_VERSION}/$APP_VERSION/g; s/{MOD_VERSION}/$mod_version/g" release-notes/mod.md > notes.md
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "Яндекс Музыка Sync $mod_version (Яндекс Музыка $APP_VERSION)" \
            --notes-file notes.md
