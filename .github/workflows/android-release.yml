# Builds the Android app and publishes it as a GitHub release.
#
# The version is android/version.properties (versionName). A push to main that
# touches the app or the Rust crates builds the APK; if there is no release
# `android-v<versionName>` yet, it is published and the tag is created on that
# commit — bumping versionName (and versionCode) is how a new release is made.
# «Run workflow» on the Actions page builds the APK without a release.
#
# The APK is signed with the key from the repository secrets (docs/android.md).
# Without them the build still runs, but the APK comes out unsigned and no
# release is made: the app updates itself only to APKs signed with its own key.

name: android-release

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "release-notes/android.md"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Rust core
        # The runner's NDK path is a shell variable, not part of the `env`
        # context, so it is picked up here rather than in an `env:` block.
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o crates/android/jniLibs build --release -p ymsync-android

      - id: signing
        name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no signing key in the secrets — the APK will be unsigned and no release made (docs/android.md)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - id: built
        name: Name the APK
        run: |
          version=$(grep -m1 '^versionName=' android/version.properties | cut -d= -f2 | tr -d '[:space:]')
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          [ -f "$apk" ] || { echo "::error::no APK"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/YaModSync-$version.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS.txt

      - name: Check the signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs dist/*.apk | grep -v "^Signer #1 public key"

      - uses: actions/upload-artifact@v4
        with:
          name: yamodsync-android-${{ steps.built.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.built.outputs.version }}
        run: |
          tag="android-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Релиз $tag уже есть — новый не создаю. Поднимите versionName в android/version.properties."
            exit 0
          fi
          sed "s/{VERSION}/$VERSION/g" release-notes/android.md > notes.md
          # Не «latest»: последним релизом репозитория остаётся мод для ПК.
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --latest=false \
            --title "Яндекс Музыка Sync для Android $VERSION" \
            --notes-file notes.md

      - name: Forget the key
        if: always()
        run: rm -f android/release.jks android/keystore.properties
